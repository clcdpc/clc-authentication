name: build-test-publish

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*.*.*', 'v*.*.*-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  DOTNET_VERSION: 10.0.x
  PACKAGE_PROJECT: src/clc-authentication.csproj
  TEST_PROJECT: tests/Clc.Authentication.Tests/Clc.Authentication.Tests.csproj
  PACKAGE_OUTPUT_DIR: artifacts/packages

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set package version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            number='(0|[1-9][0-9]*)'
            identifier="($number|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
            release_tag="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
            if [[ ! "$GITHUB_REF_NAME" =~ $release_tag ]]; then
              echo "Invalid release tag '$GITHUB_REF_NAME'. Expected a tag like v2.0.0 or v2.0.0-beta.1." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore "$TEST_PROJECT"

      - name: Build
        run: >-
          dotnet build "$TEST_PROJECT" --configuration Release --no-restore
          -warnaserror -p:Version="$PACKAGE_VERSION"

      - name: Test
        run: >-
          dotnet test "$TEST_PROJECT" --configuration Release --no-build
          --logger trx --results-directory TestResults

      - name: Pack
        run: >-
          dotnet pack "$PACKAGE_PROJECT" --configuration Release --no-build
          -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION"
          --output "$PACKAGE_OUTPUT_DIR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload release packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT_DIR }}/*.snupkg
          if-no-files-found: error

  publish:
    needs: build-test-pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ env.PACKAGE_OUTPUT_DIR }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: mfields

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "$PACKAGE_OUTPUT_DIR/*.nupkg"
          --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          --skip-duplicate
